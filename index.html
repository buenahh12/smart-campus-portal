  <link rel="icon" type="image/png" sizes="192x192" href="%BASE_URL%icon-192.png" />

  <style>
    /* Shown at once while the app downloads (slow connections); React replaces it. */
    .boot { min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 14px; padding: 24px; color: #1f4a35; background: #f5efe2; font: 600 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
    .boot img { width: 72px; height: 72px; border-radius: 50%; }
    .boot b { font-size: 20px; }
    .boot i { width: 28px; height: 28px; border: 3px solid #d7e0d1; border-top-color: #1f4a35; border-radius: 50%; animation: boot-spin .9s linear infinite; }
    @keyframes boot-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .boot i { animation: none; } }
  </style>
</head>
<body>
  <div id="root"><div class="boot" role="status"><img src="%BASE_URL%logologooo.jpg" alt="" width="72" height="72" /><b>Saint Simon of Cyrene Academy</b><span>Loading SSCA NAVI…</span><i aria-hidden="true"></i><noscript>Please turn on JavaScript to use SSCA NAVI.</noscript></div></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
